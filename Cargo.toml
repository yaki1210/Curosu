[package]
name = "curosu"
version = "0.1.3"
edition = "2021"
description = "Curosu cursor overlay for Windows"
license = "MIT"

[[bin]]
name = "curosu"
path = "src/main.rs"

[build-dependencies]
embed-resource = "2"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_Media",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
egui = "0.28"
eframe = "0.28"
# 与 eframe 0.28 内部一致的 winit，用于 any_thread 事件循环构建钩子
winit = { version = "0.29", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
